# Publishes a GitHub release, in either of two ways:
#
# 1. Push a version tag (v1.2.3). The tag's message becomes the release: its
#    first line is the title and the rest the notes (Markdown). Keep Markdown
#    headings by tagging with --cleanup=verbatim, which stops git from
#    dropping lines that start with #:
#      git tag -a v0.2.0 --cleanup=verbatim -F notes.md
#      git push origin v0.2.0
#
# 2. Run it by hand (Actions > Release > Run workflow) with a version and
#    notes. It tags the commit it runs on and publishes the release.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to create, e.g. v0.2.0
        required: true
      title:
        description: Release title (default "Ultrajump <tag>")
        required: false
      notes:
        description: Release notes (Markdown)
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          TITLE: ${{ inputs.title }}
          NOTES: ${{ inputs.notes }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            printf '%s\n' "$NOTES" > notes.md
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "${TITLE:-Ultrajump $TAG}" --notes-file notes.md
          else
            # Checkout can leave the tag without its message; fetch the tag itself.
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            git tag --list "$TAG" --format='%(contents:body)' > notes.md
            gh release create "$TAG" --verify-tag \
              --title "$(git tag --list "$TAG" --format='%(contents:subject)')" \
              --notes-file notes.md
          fi
